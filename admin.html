<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workforce Hub — Add New Employee</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* Top brand bar */
    .topbar {
        background: linear-gradient(90deg, var(--primary), var(--primary-dark));
        color: #fff;
        padding: 18px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .topbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    .topbar .brand-icon {
        width: 32px;
        height: 32px;
        background: rgba(255,255,255,0.18);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
    }

    .topbar .subtitle {
        font-size: 13px;
        opacity: 0.85;
        font-weight: 400;
    }

    /* Page wrapper */
    .page {
        max-width: 760px;
        margin: 36px auto 60px;
        padding: 0 20px;
    }

    .form-container {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        padding: 36px 40px;
    }

    .form-container h2 {
        margin: 0 0 4px 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
    }

    .form-container .form-desc {
        margin: 0 0 28px 0;
        font-size: 14px;
        color: var(--muted);
    }

    .section-label {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--primary);
        margin: 28px 0 14px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
    }

    .form-container .section-label:first-of-type { margin-top: 0; }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text);
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group input[type="password"],
    .form-group input[type="file"],
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fbfcfe;
        color: var(--text);
        transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        background: #fff;
    }

    .radio-group {
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fbfcfe;
    }

    .radio-option {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
    }

    .radio-option input { accent-color: var(--primary); cursor: pointer; }
    .radio-option label { margin: 0; font-weight: 500; cursor: pointer; }

    .submit-btn {
        width: 100%;
        margin-top: 28px;
        padding: 13px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
    }

    .submit-btn:hover { background: var(--primary-dark); }

    .view-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
        padding: 10px 18px;
        background: #fff;
        color: var(--primary);
        border: 1px solid var(--primary);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
    }

    .view-link:hover { background: var(--primary); color: #fff; }

    .actions-row {
        display: flex;
        justify-content: center;
        margin-top: 8px;
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">⏱</div>
        Workforce Hub
    </div>
    <div class="subtitle">Admin Console — Employee Management</div>
</div>

<div class="page">
    <div class="form-container">
        <h2>Add New Employee</h2>
        <p class="form-desc">Register a new employee, set their permanent/temporary status, and assign their system role.</p>

        <form id="absentForm" action="http://127.0.0.1:5001/submit" method="POST" enctype="multipart/form-data">

            <div class="section-label">Personal Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="emp">Employee Code</label>
                    <input type="text" id="emp" name="emp_code" required placeholder="Enter Emp code">
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="employee_name" required placeholder="Enter your full name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="number">Phone Number</label>
                    <input type="number" id="number" name="phone_number" required placeholder="Enter the phone number">
                </div>
                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="text" id="email" name="email_id" required placeholder="Enter the email id">
                </div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="dateofjoining">Date of Joining</label>
                    <input type="date" id="dateofjoining" name="date_join" required>
                </div>
            </div>

            <div class="form-group">
                <label>Employment Type</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="tem" name="tem_per" value="Temporary">
                        <label for="tem">Temporary</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="per" name="tem_per" value="permanent">
                        <label for="per">Permanent</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="photo">Profile Picture</label>
                <input type="file" id="photo" name="photo_data" accept="image/*">
            </div>

            <div class="section-label">Account & Access</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Assign Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="role">System Role</label>
                    <select id="role" name="role" required>
                        <option value="employee">Regular Employee</option>
                        <option value="manager">Manager / Approver</option>
                        <option value="admin">System Admin</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="submit-btn">Add Employee</button>
        </form>

        <div class="actions-row">
            <a href="http://127.0.0.1:5001/view" class="view-link">View All Names</a>
        </div>
    </div>
</div>

</body>
</html>
